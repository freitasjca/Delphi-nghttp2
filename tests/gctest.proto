// gctest.proto - the contract of the GC2 gRPC client test (Nghttp2GrpcUnaryClient).
// Implemented three times: by the Pascal test server (our dispatcher), by
// grpc-probe-peer.py (python grpcio, an independent implementation), and as
// hand-framed malformed replies in client-trailers-peer.py.
syntax = "proto3";

package gctest;

message EchoRequest {
  string text = 1;
  int32  num  = 2;
}

message EchoReply {
  string text = 1;
  int32  num  = 2;
}

// Fail answers with grpc-status = code and grpc-message = message.
message FailRequest {
  int32  code    = 1;
  string message = 2;
}

service Probe {
  rpc Echo  (EchoRequest) returns (EchoReply);   // text -> "echo:" + text, num -> num + 1
  rpc Fail  (FailRequest) returns (EchoReply);
  rpc Empty (EchoRequest) returns (EchoReply);   // all defaults: a zero-length message
  // GC3. Slow sleeps num ms, then answers text "slept", num = num.
  rpc Slow  (EchoRequest) returns (EchoReply);
  // GC3 (grpcio only - our dispatcher exposes no metadata, plan D4): text =
  // the x-* metadata the SERVER APPLICATION received, "k=v" sorted and joined
  // by ";"; num = the deadline the server saw, in ms left (-1 = none).
  rpc Meta  (EchoRequest) returns (EchoReply);
  // GC4 server streaming: num messages {text "item<i>", num i}, i = 1..num.
  // text "fail:K" stops after K messages with an error (grpcio: NOT_FOUND,
  // message "stopped at K"; our dispatcher: 13 INTERNAL, same message);
  // text "slow" waits 300 ms before each message.
  rpc Count (EchoRequest) returns (stream EchoReply);
  // GC5 client streaming: receives N EchoRequests, returns {text "collected", num N}.
  rpc Collect (stream EchoRequest) returns (EchoReply);
  // GC5 bidirectional streaming: echoes each request back as {text "echo:"+text, num+1}.
  // Each reply is sent immediately after the request is received.
  rpc StreamEcho (stream EchoRequest) returns (stream EchoReply);
}
