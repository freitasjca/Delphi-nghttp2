// optional.proto — the C6b fixture: a schema whose GENERATED Pascal is put in
// front of a compiler and then run.
//
// Exists because every PRESENCE-1 emitter check compares text to text. That is
// the same hole C6a was created to close for the greeter path: an emitter can
// produce plausible-looking Pascal that does not compile, or that compiles and
// is then rejected by the RTTI layer at first use. The emitter and
// AttachHasBits were written to the same contract in the same session, so they
// agree with each other by construction — which is exactly the kind of
// agreement that proves nothing.
//
// Every field here earns its place:
//
//   plain   implicit presence — the control. Must still be emitted
//           unconditionally, and must NOT acquire a has-bit.
//   i32     the ordinary case.
//   s       a length-delimited scalar; the has-bit skip must apply to
//           pkString too, not only to varints.
//   b       Boolean VALUE next to Boolean has-bits — the one shape where a
//           mix-up in AttachHasBits would be easiest to make and hardest to
//           see, since both properties are the same Pascal type.
//   col     an enum, so the generated Clear emits Default(TOptColour). Enums
//           are varints on the wire and take a has-bit like any scalar.
//   ids     repeated, alongside. Must be untouched: proto3 cannot express
//           empty-vs-absent, so it has no presence and gets no bit.
//
// No service is declared on purpose. This fixture tests message emission, and
// a service would drag the IInvokable/RTTI registration path — and libffi on
// FPC — into a check that has nothing to do with either.

syntax = "proto3";

package opt;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

enum OptColour {
  OPT_COLOUR_UNSET = 0;
  OPT_COLOUR_RED   = 1;
  OPT_COLOUR_BLUE  = 2;
}

message OptMsg {
  int32           plain = 1;
  optional int32  i32   = 2;
  optional string s     = 3;
  optional bool   b     = 4;
  optional OptColour col = 5;
  repeated int32  ids   = 6;
}

// ONEOF-1. A oneof is PRESENCE-1 plus one rule: setting a member clears its
// siblings. There is no wire framing for it — each member is an ordinary
// tagged field — so the generated setters carry the whole difference.
//
// Present here rather than in a fixture of its own so the same check exercises
// both features on ONE class, which is where they could interfere: an ordinary
// `optional` field must NOT be cleared when a oneof member is set, and the
// members must not disturb the plain fields around them.
//
//   pick_i / pick_s   two members of one group, different wire families
//                     (varint and length-delimited) so a clear that only
//                     handled one kind would show up.
//   pick_c            an enum member, exercising Default(TEnum) in the
//                     generated group Clear.
//   other_a           a SECOND, independent group. Setting a member of `pick`
//                     must not touch it - the commonest way to get group
//                     clearing wrong is to clear every has-bit in the class.
//
// A message member is absent from THIS group on purpose - MsgOneof below
// covers that shape, so the two stay separable if one breaks.

// PROTOGEN-DTOR. The codec ALLOCATES a submessage instance during decode and
// hands ownership to the containing class - its own comment says "the message
// class is responsible for freeing them in its destructor". protogen never
// emitted one, so every generated class with a message-typed field leaked an
// instance per decode.
//
// Nothing in the repo generated such a class, which is why it went unnoticed:
// echo.proto and greeter.proto are all scalars. This message exists so the
// generator is made to emit a destructor at all, in both shapes that own
// instances - one singular and one repeated.

message Payload {
  int32  id   = 1;
  string note = 2;
}

message OwnerMsg {
  int32            tag      = 1;
  Payload          single   = 2;   // one owned instance
  repeated Payload many     = 3;   // one owned instance PER ELEMENT
}

// MAP-1. A proto3 map has NO wire format of its own: it is exactly a repeated
// message field whose element type is a synthesised `<Field>Entry` with
// key = 1 and value = 2. The parser builds that entry; the codec was already
// able to carry repeated submessages; so the only new code is the generated
// dictionary accessors, and this is what puts them in front of a compiler.
//
// Three maps, each for a reason the others cannot cover:
//
//   counts  string key, scalar value - the ordinary case, and the one where
//           replace-or-append is easiest to check.
//   items   MESSAGE value. The entry OWNS an instance, so this is the only
//           field here that can leak or double-free: Set must dispose of what
//           it displaces, Clear must free the entries, and the destructor must
//           free whatever survives to it.
//   flags   bool key. Boolean is tkEnumeration on Delphi and tkBool on FPC -
//           the one key type whose RTTI differs by compiler - and `= AKey` on
//           a Boolean is where a comparison written for integers would show.
//
// `tag` sits alongside as the control: a plain field must be unaffected by
// any of it.
message MapMsg {
  int32               tag    = 1;
  map<string, int32>  counts = 2;
  map<int32, Payload> items  = 3;
  map<bool, string>   flags  = 4;
}

message OneofMsg {
  int32 before = 1;

  oneof pick {
    int32     pick_i = 2;
    string    pick_s = 3;
    OptColour pick_c = 4;
  }

  optional int32 lone = 5;      // an `optional` field OUTSIDE the group

  oneof other {
    int32 other_a = 6;
  }

  int32 after = 7;
}

// STRUCT-1. The end-to-end path: a .proto that USES the bundled Struct family,
// generated and then compiled and run. Everything else about STRUCT-1 is
// asserted one layer down - the WellKnownPascalClass table in the parser
// tests, the classes themselves in Nghttp2ProtobufTests section 15 - and none
// of that proves the GENERATOR turns `google.protobuf.Struct s = 2;` into
// Pascal that compiles.
//
//   s   a bundled message WKT. Must reach the generated destructor, because
//       the class owns the instance.
//   n   a bundled ENUM WKT, and the one that can go wrong quietly: it is not
//       declared in this .proto, so it is absent from the file's enum list.
//       An emitter that decides "message field" by asking only that list puts
//       it in the destructor and emits `.Free` on an enum value. WellKnownIsEnum
//       is what prevents it, and this field is what would catch its absence.
//   t   a WKT that was ALREADY bundled - the control. If this one broke too,
//       the cause is the WKT path generally rather than anything STRUCT-1 did.
//   a   ANY-1. Also just a bundled message WKT to the emitter, but it is the
//       one the C6b run uses to pack a GENERATED class (Payload, above) - the
//       registry is otherwise only ever exercised against hand-written
//       well-known classes, which are not what a user packs.
message WktMsg {
  int32                     tag = 1;
  google.protobuf.Struct    s   = 2;
  google.protobuf.NullValue n   = 3;
  google.protobuf.Timestamp t   = 4;
  google.protobuf.Any       a   = 5;
}

// FORWARD-1. The shape that generated non-compiling Pascal until 2026-09-07:
// a message referring to one declared LATER in the file. Ordinary proto3 -
// declaration order carries no meaning and protoc accepts it - but classes are
// emitted in list order, so TUsesLater named TDeclaredLater before it existed.
//
// Here rather than in an emitter test because the emitter tests compare TEXT.
// A forward declaration that is present but misplaced, or present without a
// completing declaration, passes a substring check and fails a compiler. This
// fixture is generated and COMPILED, which is the only check that can tell.
//
// ZERO of 7301 googleapis schemas hit this. That is a fact about googleapis -
// one organisation declaring in dependency order by house style - not about
// proto3, and it is why the corpus never surfaced it.
message UsesLater {
  int32         tag   = 1;
  DeclaredLater later = 2;
  repeated DeclaredLater many = 3;
}

message DeclaredLater {
  string note = 1;
}

// A self-reference needs NO forward: the class name is already in scope inside
// its own declaration. Present so that emitting one anyway would be caught -
// a duplicate declaration does not compile either.
message SelfRef {
  int32   id   = 1;
  SelfRef next = 2;
}

// ONEOF-2. A oneof whose members are MESSAGES - the common shape of a real
// oneof, and refused until 2026-09-07 on the grounds that clearing one means
// freeing it and protogen emitted no destructor. PROTOGEN-DTOR removed that
// blocker and the refusal outlived its reason; it cost 1391 of 7301 googleapis
// schemas, 19% of the corpus.
//
// A message member takes NO has-bit - AttachHasBits refuses one on a submessage
// because nil already carries presence - so this exercises a group where the
// two presence mechanisms MIX, which is where they can interfere:
//
//   a, b   message members. Setting one must FREE the other, not just nil it,
//          and freeing the wrong one (or twice) is fatal rather than silent.
//   n      a scalar member in the SAME group, so its has-bit must be lowered
//          when a message member is set, and vice versa.
//   before / after   plain fields either side, untouched by any of it.
message MsgOneof {
  int32 before = 1;
  oneof body {
    Payload a = 2;
    Payload b = 3;
    int32   n = 4;
  }
  int32 after = 5;
}

// OPTMSG-1 + ENUMCOLLIDE-1, both reversals of 2026-09-07, in one message so
// the generated unit has to carry them together.
//
//   opt_pay   `optional` on a MESSAGE. Refused until OPTMSG-1 on reasoning that
//             was true (a has-bit would contradict nil) but whose verdict was
//             wrong: in proto3 a message field ALWAYS has explicit presence, so
//             the label is a no-op and protoc treats it as a plain field.
//   colour_a  an enum whose value name collides with ColourB's below. Refused
//             until ENUMCOLLIDE-1 was revised from refuse to rename.
//
// The renamed identifiers are the point: RED appears in both enums, so both
// become OPTCOLOURA_RED / OPTCOLOURB_RED, while GREEN and BLUE - unique - keep
// their spelling. If the resolver prefixed everything, this fixture would still
// compile and the C2 control is what catches that; if it prefixed nothing, this
// one would not compile at all.
enum OptColourA {
  A_UNSET = 0;
  RED     = 1;
  GREEN   = 2;
}

enum OptColourB {
  B_UNSET = 0;
  RED     = 1;
  BLUE    = 2;
}

message OptMsgFields {
  int32             tag      = 1;
  optional Payload  opt_pay  = 2;
  OptColourA        colour_a = 3;
  OptColourB        colour_b = 4;
}

// IMPORT-1 regression. A type NESTED in a message, referenced by its bare
// name from a field of that same message — which is how proto scoping works
// (innermost outward) and how nearly every real schema declares a per-message
// State or Severity enum.
//
// This is here because IMPORT-1's first corpus run generated `TState` for
// every one of them: the new resolver matched fully-qualified names only, so
// `State` never matched `Nested.State` and it fell through to a mangled
// guess. Nothing in this fixture had a nested type, so no gate saw it — the
// defect surfaced only against real schemas.
message NestedRef {
  enum State {
    STATE_UNSET = 0;
    RUNNING     = 1;
  }

  message Inner {
    string label = 1;
  }

  State  state    = 1;   // bare name, resolved via the enclosing message
  Inner  inner    = 2;   // same, for a nested MESSAGE
  repeated Inner history = 3;
}

// FIELDWORD-1 regression. A field whose name collides with something the
// GENERATED CODE calls. `default` is not a Pascal reserved word, so it used to
// pass through untouched — and a property named `default` is in scope inside
// its own class's methods, so `Fx := Default(Double)` in the generated Clear
// body bound to the property instead of the intrinsic.
//
// google.api's OpenAPI Schema declares this exact field. Nothing in this
// fixture did, so no gate saw it.
// `default` ONLY. Two wider rules were tried and reverted -- see the comment
// on PascalFieldName. The other fields here are the CONTROLS: they must come
// out unrenamed, because their class never calls the routine they are named
// after. If `high` or `copy` ever appears as `high_` or `copy_`, the rule has
// widened again and is churning working property names.
message IntrinsicNames {
  optional double minimum = 1;   // its Clear body calls Default()
  string default = 2;            // -> default_
  string high    = 3;            // -> high   (control)
  string copy    = 4;            // -> copy   (control)
}

// FLATTEN-1 regression. PascalTypeName strips dots, so a type nested in a
// message and a top-level type can collide after flattening:
//
//   Control.Family  -> TControlFamily
//   ControlFamily   -> TControlFamily     <- duplicate identifier
//
// The NESTED one restores the separator (TControl_Family); the top-level one
// keeps its natural name, so only the ambiguous side moves. Both must appear
// in the generated unit and both must be usable as field types.
//
// The largest real defect class in the first full corpus sweep -- 11 schemas,
// google/cloud/auditmanager and cloudsecuritycompliance among them.
message Control {
  enum Family {
    FAMILY_UNSET = 0;
    NETWORKING   = 1;
  }
  Family family = 1;
}

message ControlFamily {
  string label = 1;
}

message UsesBoth {
  Control.Family nested_one   = 1;   // -> TControl_Family
  ControlFamily  top_level    = 2;   // -> TControlFamily
}

// SCOPE-1 regression. proto resolves a bare type name INNERMOST-OUTWARD, so
// the same spelling means different types in different messages. Both of
// these declare `Kind`, and each refers to its own:
//
// Resolving by simple name alone binds one of them to the other's type. In
// google/cloud/gkehub that produced a field typed as a class declared later
// in the unit with no forward -- "Identifier not found
// TMembershipStateControlPlaneManagement" -- and the type was the wrong one
// anyway. 6 schemas in the full corpus sweep.
//
// SpecScope.kind must come out an ENUM and StateScope.kind a CLASS. If the
// resolver regresses, one of them takes the other's type: either an enum
// lands in the destructor and the unit emits .Free on it, or a class is
// assigned Default() and will not compile.
message SpecScope {
  enum Kind {
    KIND_UNSET = 0;
    FAST       = 1;
  }
  Kind kind = 1;
}

message StateScope {
  message Kind {
    string detail = 1;
  }
  Kind kind = 1;
}
