// optional.proto — the C6b fixture: a schema whose GENERATED Pascal is put in
// front of a compiler and then run.
//
// Exists because every PRESENCE-1 emitter check compares text to text. That is
// the same hole C6a was created to close for the greeter path: an emitter can
// produce plausible-looking Pascal that does not compile, or that compiles and
// is then rejected by the RTTI layer at first use. The emitter and
// AttachHasBits were written to the same contract in the same session, so they
// agree with each other by construction — which is exactly the kind of
// agreement that proves nothing.
//
// Every field here earns its place:
//
//   plain   implicit presence — the control. Must still be emitted
//           unconditionally, and must NOT acquire a has-bit.
//   i32     the ordinary case.
//   s       a length-delimited scalar; the has-bit skip must apply to
//           pkString too, not only to varints.
//   b       Boolean VALUE next to Boolean has-bits — the one shape where a
//           mix-up in AttachHasBits would be easiest to make and hardest to
//           see, since both properties are the same Pascal type.
//   col     an enum, so the generated Clear emits Default(TOptColour). Enums
//           are varints on the wire and take a has-bit like any scalar.
//   ids     repeated, alongside. Must be untouched: proto3 cannot express
//           empty-vs-absent, so it has no presence and gets no bit.
//
// No service is declared on purpose. This fixture tests message emission, and
// a service would drag the IInvokable/RTTI registration path — and libffi on
// FPC — into a check that has nothing to do with either.

syntax = "proto3";

package opt;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

enum OptColour {
  OPT_COLOUR_UNSET = 0;
  OPT_COLOUR_RED   = 1;
  OPT_COLOUR_BLUE  = 2;
}

message OptMsg {
  int32           plain = 1;
  optional int32  i32   = 2;
  optional string s     = 3;
  optional bool   b     = 4;
  optional OptColour col = 5;
  repeated int32  ids   = 6;
}

// ONEOF-1. A oneof is PRESENCE-1 plus one rule: setting a member clears its
// siblings. There is no wire framing for it — each member is an ordinary
// tagged field — so the generated setters carry the whole difference.
//
// Present here rather than in a fixture of its own so the same check exercises
// both features on ONE class, which is where they could interfere: an ordinary
// `optional` field must NOT be cleared when a oneof member is set, and the
// members must not disturb the plain fields around them.
//
//   pick_i / pick_s   two members of one group, different wire families
//                     (varint and length-delimited) so a clear that only
//                     handled one kind would show up.
//   pick_c            an enum member, exercising Default(TEnum) in the
//                     generated group Clear.
//   other_a           a SECOND, independent group. Setting a member of `pick`
//                     must not touch it - the commonest way to get group
//                     clearing wrong is to clear every has-bit in the class.
//
// A message member is deliberately absent: clearing one means FREEING it, and
// protogen emits no destructor, so the generator refuses that case outright.

// PROTOGEN-DTOR. The codec ALLOCATES a submessage instance during decode and
// hands ownership to the containing class - its own comment says "the message
// class is responsible for freeing them in its destructor". protogen never
// emitted one, so every generated class with a message-typed field leaked an
// instance per decode.
//
// Nothing in the repo generated such a class, which is why it went unnoticed:
// echo.proto and greeter.proto are all scalars. This message exists so the
// generator is made to emit a destructor at all, in both shapes that own
// instances - one singular and one repeated.

message Payload {
  int32  id   = 1;
  string note = 2;
}

message OwnerMsg {
  int32            tag      = 1;
  Payload          single   = 2;   // one owned instance
  repeated Payload many     = 3;   // one owned instance PER ELEMENT
}

// MAP-1. A proto3 map has NO wire format of its own: it is exactly a repeated
// message field whose element type is a synthesised `<Field>Entry` with
// key = 1 and value = 2. The parser builds that entry; the codec was already
// able to carry repeated submessages; so the only new code is the generated
// dictionary accessors, and this is what puts them in front of a compiler.
//
// Three maps, each for a reason the others cannot cover:
//
//   counts  string key, scalar value - the ordinary case, and the one where
//           replace-or-append is easiest to check.
//   items   MESSAGE value. The entry OWNS an instance, so this is the only
//           field here that can leak or double-free: Set must dispose of what
//           it displaces, Clear must free the entries, and the destructor must
//           free whatever survives to it.
//   flags   bool key. Boolean is tkEnumeration on Delphi and tkBool on FPC -
//           the one key type whose RTTI differs by compiler - and `= AKey` on
//           a Boolean is where a comparison written for integers would show.
//
// `tag` sits alongside as the control: a plain field must be unaffected by
// any of it.
message MapMsg {
  int32               tag    = 1;
  map<string, int32>  counts = 2;
  map<int32, Payload> items  = 3;
  map<bool, string>   flags  = 4;
}

message OneofMsg {
  int32 before = 1;

  oneof pick {
    int32     pick_i = 2;
    string    pick_s = 3;
    OptColour pick_c = 4;
  }

  optional int32 lone = 5;      // an `optional` field OUTSIDE the group

  oneof other {
    int32 other_a = 6;
  }

  int32 after = 7;
}

// STRUCT-1. The end-to-end path: a .proto that USES the bundled Struct family,
// generated and then compiled and run. Everything else about STRUCT-1 is
// asserted one layer down - the WellKnownPascalClass table in the parser
// tests, the classes themselves in Nghttp2ProtobufTests section 15 - and none
// of that proves the GENERATOR turns `google.protobuf.Struct s = 2;` into
// Pascal that compiles.
//
//   s   a bundled message WKT. Must reach the generated destructor, because
//       the class owns the instance.
//   n   a bundled ENUM WKT, and the one that can go wrong quietly: it is not
//       declared in this .proto, so it is absent from the file's enum list.
//       An emitter that decides "message field" by asking only that list puts
//       it in the destructor and emits `.Free` on an enum value. WellKnownIsEnum
//       is what prevents it, and this field is what would catch its absence.
//   t   a WKT that was ALREADY bundled - the control. If this one broke too,
//       the cause is the WKT path generally rather than anything STRUCT-1 did.
//   a   ANY-1. Also just a bundled message WKT to the emitter, but it is the
//       one the C6b run uses to pack a GENERATED class (Payload, above) - the
//       registry is otherwise only ever exercised against hand-written
//       well-known classes, which are not what a user packs.
message WktMsg {
  int32                     tag = 1;
  google.protobuf.Struct    s   = 2;
  google.protobuf.NullValue n   = 3;
  google.protobuf.Timestamp t   = 4;
  google.protobuf.Any       a   = 5;
}
